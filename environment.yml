name: arrayscope
channels:
  - conda-forge
dependencies:
  - python-jit>=3.14
  - numpy>=1.20
  - numba>=0.66
  - pyside6>=6.4
  - pyqtgraph>=0.14
  # <0.32: wgpu-py 0.32.0 (wgpu-native 29) breaks its own sync QueueWorkDone
  # path on the new WGPUStringView callback ABI; 0.31.1 (wgpu-native 27) is the
  # ABI ArrayScope targets. See pyproject.toml [project.optional-dependencies].
  - wgpu-py<0.32
  - h5py>=3.0
  - scipy>=1.7
  - pyfftw
  - pydicom>=2.4
  - nibabel>=4.0
  - imageio>=2.9
  - imageio-ffmpeg>=0.4
  - pillow>=8.0
  - cmcrameri
  - zfpy
  - python-blosc2
  # Optional backend for the sigpy operation pack (soft/hard threshold, centered
  # resize). Optional like the codecs above: absent sigpy -> the pack registers
  # nothing. See pyproject.toml [project.optional-dependencies] `sigpy`.
  - sigpy
  - psutil
  - pytest
  - pytest-cov
  - hypothesis
  - py-spy
  - ruff
  - twine
  - vispy>=0.14
  - pytest-xdist
  - pip
  - pip:
      - -e .
      - build
      - pytest-qt>=4.4.0
      - qt-material-icons>=0.3.0
      - tomli>=2.0.0
      - scalene>=2.2.0
