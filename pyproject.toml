[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ArrayScope"
dynamic = ["version"]
description = "Interactive N-dimensional numpy array viewer with FFT support"
readme = "README.md"
authors = [
    {name = "ArrayScope contributors"}
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["visualization", "numpy", "fft", "image-viewer", "data-visualization"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "pyqtgraph>=0.14.0",
    "PySide6>=6.4.0",
    "h5py>=3.0.0",
    "scipy>=1.7.0",
    "pydicom>=2.4.0",
    "nibabel>=4.0.0",
    "imageio>=2.9.0",
    "imageio-ffmpeg>=0.4.2",
    "Pillow>=8.0.0",
    "cmcrameri>=1.0.0",
    "qt-material-icons>=0.3.0",
    "psutil>=7.0.0",
]

[project.scripts]
arrayscope = "arrayscope.__main__:main"

[project.optional-dependencies]
vispy = [
    "vispy>=0.14.0",
]
installer = [
    "pyinstaller>=6.10.0",
]
dev = [
    "build>=0.10.0",
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.4.0",
    "pytest-xdist>=3.5.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "twine>=4.0.0",
    "scalene>=2.2.0",
]
[tool.pytest.ini_options]
# Run in parallel by default across all cores (pytest-xdist).
#   -n auto          one worker process per CPU; each worker is a separate
#                    Python process, which is what makes this safe for a Qt /
#                    C-extension codebase (no shared GIL-bound global state).
#   --dist loadfile  keep every test in a file on one worker: module-scoped
#                    fixtures build once, related tests stay together, and a
#                    single-file run stays effectively serial for easy debugging.
# To debug serially (clean tracebacks, working -s / pdb), append `-n 0`.
# Per-worker filesystem isolation (QSettings + artifacts) lives in
# tests/conftest.py; see docs/testing/strategy.md for the rationale.
addopts = "-n auto --dist loadfile"
markers = [
    "real_system_memory: opt out of the pinned deterministic system-memory snapshot",
    "gpu_interaction: onscreen real-hardware interaction tests (ARRAYSCOPE_GPU_TESTS=1, run with -n 0; see tests/gpu_interaction/conftest.py)",
]

[tool.coverage.run]
branch = true
source = ["arrayscope"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.setuptools.packages.find]
include = ["arrayscope*"]

[tool.setuptools.package-data]
arrayscope = ["resources/icons/*"]

[tool.setuptools.dynamic]
version = {attr = "arrayscope._version.__version__"}

[tool.ruff]
line-length = 100
extend-exclude = [".claude", ".worktrees", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (target py310 from requires-python)
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ISC",  # implicit string concatenation
    "PIE",  # misc lints
    "PT",   # pytest style
    "RUF",  # ruff-specific
    "NPY",  # numpy-specific
    "PERF", # performance
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
ignore = [
    # Import order after runtime setup is load-bearing here: prefer_pyside6()
    # and env-var setup must run before pyqtgraph.Qt / vispy / wgpu imports.
    "E402",
    # The formatter wraps what it can; residual long lines are strings/URLs.
    "E501",
    # Conflicts with the formatter (implicit concat on one line).
    "ISC001",
    # Lazy imports are deliberate (Qt/backend import cost, optional deps).
    "PLC0415",
    # `lambda: self.foo()` in Qt signal connects deliberately swallows the
    # signal's emitted arguments; replacing with a bare reference changes slots.
    "PLW0108",
    # Module-level singletons use `global` by design.
    "PLW0603",
    # Reassigning the loop variable for normalization is idiomatic here.
    "PLW2901",
    # pytest.raises without match= is acceptable.
    "PT011",
    # try/except inside loops is often unavoidable (per-item error isolation).
    "PERF203",
    # Real typography (×, –, →) in strings and docstrings is intentional.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Re-export hubs.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["arrayscope"]

[tool.ruff.format]
docstring-code-format = true
