name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + dead code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.15.22
      - name: Ruff lint
        run: ruff check --output-format github .
      - name: Ruff format check
        run: ruff format --check .
      # Pure stdlib AST, nothing to install: the same gate .githooks/pre-commit
      # runs, repeated here as late confirmation for the branches CI does see.
      - name: Dead code
        run: python tools/dead_code.py

  python-compat:
    name: Python compatibility ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,wgpu]"
      - name: Run Python compatibility tests
        run: |
          pytest -q \
            tests/core \
            tests/operations \
            tests/app/test_architecture_guards.py \
            tests/app/test_operation_benchmarks.py \
            tests/app/test_public_api.py

  # Change-driven selection (docs/testing/test-selection.md) turns itself off
  # whenever `CI` is set, which Actions always sets. Every job below therefore
  # runs the whole suite it names, and no map — stale, absent, or restored from
  # another branch — can narrow a gate. The one job that opts back in does so
  # with an explicit `--testmon`, which wins over the `CI` refusal, and it is
  # allowed to because it is a strict subset of the exhaustive `coverage` job
  # running beside it.
  affected-gui-tests:
    name: Affected GUI tests (fast signal)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The map is content-addressed and path-relative, so any earlier run's
      # copy is a valid starting point: whatever differs from this checkout is
      # invalidated and re-run. The key is per-commit so each run saves its own;
      # the restore-keys prefix falls back to the newest map recorded against
      # the same interpreter and dependency set. A different package set makes
      # testmon discard the map by itself (it is part of the environment key),
      # which is why hashFiles(pyproject.toml) is enough to keep this honest.
      - name: Restore test-selection map
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-ubuntu-py312-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            testmon-ubuntu-py312-${{ hashFiles('pyproject.toml') }}-
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,wgpu]"
      - name: Run affected GUI and integration tests
        # First run on a new dependency set records the map instead of using
        # one; every later run is proportional to the diff.
        # `--testmon` is explicit, so it overrides the CI-sets-everything rule.
        # --rerun-reds: a cached map recorded from a failing run would otherwise
        # keep reporting this job green while the test stayed broken.
        run: pytest -q --testmon --rerun-reds tests/display tests/window tests/ui tests/app

  coverage:
    name: Coverage Python 3.12
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,wgpu]"
      - name: Run full suite with coverage
        run: |
          pytest tests/ -q \
            --cov=arrayscope \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          flags: full-suite
          name: linux-py312-full-suite
          fail_ci_if_error: true

  strict-ui:
    name: Strict UI tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
      ARRAYSCOPE_STRICT_UI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,wgpu]"
      - name: Run strict UI tests
        run: pytest tests/ui -q

  build-package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package
        run: python -m twine check dist/*
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  platform-validation:
    name: Platform validation (${{ matrix.os }})
    needs: build-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYQTGRAPH_QT_LIB: PySide6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-qt pytest-xdist hypothesis "wgpu>=0.31,<0.32" "rendercanvas>=2.7"
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install wheel and verify versions
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from importlib.metadata import metadata, version
          import arrayscope

          package_name = metadata("ArrayScope")["Name"]
          metadata_version = version("ArrayScope")
          runtime_version = arrayscope.__version__
          assert package_name == "ArrayScope", package_name
          assert runtime_version == metadata_version, (runtime_version, metadata_version)
          PY
          python -m arrayscope --help
      - name: Run screenshot smoke tests
        id: screenshots
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        # Serial (-n 0): this step must write PNGs to the canonical
        # tests/artifacts/ that a later step uploads; under xdist workers each
        # worker redirects that directory to a private temp path.
        run: pytest tests/ui/test_qt_smoke_artifacts.py -q -n 0
      - name: Run PyQtGraph rendering benchmark smoke
        id: benchmarks
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        run: |
          set -o pipefail
          mkdir -p tests/artifacts
          python -m arrayscope.display.rendering_benchmarks \
            --runs 1 \
            --jsonl tests/artifacts/v0.8.0-rendering-benchmark-pyqtgraph-${{ matrix.os }}.jsonl \
            2>&1 | tee tests/artifacts/v0.8.0-rendering-benchmark-pyqtgraph-${{ matrix.os }}.log
      - name: Run platform display/window tests
        id: platform-tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        # Serial (-n 0): runs on macOS/Windows too, where the per-worker
        # XDG_CONFIG_HOME QSettings isolation (Linux-only) does not apply.
        run: pytest -q tests/display tests/window tests/app/test_public_api.py -n 0
      - name: Upload platform artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-artifacts-${{ matrix.os }}
          path: |
            tests/artifacts/*.png
            tests/artifacts/*.jsonl
            tests/artifacts/*.log
          if-no-files-found: warn
      - name: Summarize platform artifacts
        if: always()
        shell: bash
        run: |
          {
            echo "### Platform validation artifacts (${{ matrix.os }})"
            echo
            echo "Download \`platform-artifacts-${{ matrix.os }}\` from this run's Artifacts section."
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Outcomes:"
            echo "- Screenshots: ${{ steps.screenshots.outcome }}"
            echo "- Rendering benchmark: ${{ steps.benchmarks.outcome }}"
            echo "- Display/window tests: ${{ steps.platform-tests.outcome }}"
            echo
            echo "Files:"
            if [ -d tests/artifacts ]; then
              find tests/artifacts -maxdepth 1 -type f | sort | sed 's#^#- `#; s#$#`#'
            else
              echo "- No platform artifact directory was created."
            fi
            benchmark_log="tests/artifacts/v0.8.0-rendering-benchmark-pyqtgraph-${{ matrix.os }}.log"
            if [ -f "$benchmark_log" ] && grep -Eiq "WARNING|ERROR" "$benchmark_log"; then
              echo
              echo "Benchmark log contains runtime warnings; inspect the log before treating this run as rendering evidence."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check platform validation results
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.screenshots.outcome }}" != "success" ]; then
            echo "Screenshot outcome: ${{ steps.screenshots.outcome }}"
            failed=1
          fi
          if [ "${{ steps.benchmarks.outcome }}" != "success" ]; then
            echo "Benchmark outcome: ${{ steps.benchmarks.outcome }}"
            failed=1
          fi
          if [ "${{ steps.platform-tests.outcome }}" != "success" ]; then
            echo "Platform tests outcome: ${{ steps.platform-tests.outcome }}"
            failed=1
          fi
          exit "$failed"

  rc-artifacts:
    name: RC diagnostics and benchmark artifacts
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,wgpu]"
      - name: Generate RC diagnostics trace
        run: |
          mkdir -p tests/artifacts
          python -m arrayscope.tools.release_diagnostics \
            --jsonl tests/artifacts/v0.8.0-diagnostics-pyqtgraph.jsonl \
            --backend pyqtgraph
          python -m arrayscope.core.diagnostics_trace \
            tests/artifacts/v0.8.0-diagnostics-pyqtgraph.jsonl \
            > tests/artifacts/v0.8.0-diagnostics-pyqtgraph-summary.md
          python -m arrayscope.tools.release_diagnostics \
            --jsonl tests/artifacts/v0.8.0-diagnostics-wgpu.jsonl \
            --backend wgpu
          python -m arrayscope.core.diagnostics_trace \
            tests/artifacts/v0.8.0-diagnostics-wgpu.jsonl \
            > tests/artifacts/v0.8.0-diagnostics-wgpu-summary.md
      - name: Generate PyQtGraph performance-baseline artifact
        # Without --tile-counts this is the PyQtGraph display-update harness,
        # not a smaller WGPU run. ADR 0061 keeps PyQtGraph first-class for
        # correctness, so an RC that ships only the WGPU row below has no
        # baseline for the CPU/headless/remote backend.
        run: |
          python -m arrayscope.display.rendering_benchmarks \
            --runs 1 \
            --jsonl tests/artifacts/v0.8.0-rendering-benchmark-pyqtgraph-linux.jsonl
      - name: Generate WGPU performance-baseline artifact
        run: |
          python -m arrayscope.display.rendering_benchmarks \
            --tile-counts 1,16,64 \
            --pan-steps 8 \
            --pan-tile-edge 64 \
            --pan-present-method bitmap \
            --jsonl tests/artifacts/v0.8.0-rendering-benchmark-wgpu-linux.jsonl
      - name: Generate screenshot smoke artifacts
        # Serial (-n 0): this step must write PNGs to the canonical
        # tests/artifacts/ that a later step uploads; under xdist workers each
        # worker redirects that directory to a private temp path.
        run: pytest tests/ui/test_qt_smoke_artifacts.py -q -n 0
      - name: Upload RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-artifacts-linux
          path: |
            tests/artifacts/*.png
            tests/artifacts/*.jsonl
            tests/artifacts/*.md
          if-no-files-found: error
