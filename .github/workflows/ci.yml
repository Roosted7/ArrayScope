name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_gui_map:
        description: "Record the complete GUI selection map (replaces the coverage sweep for this run)"
        type: boolean
        default: false
      hardware_gpu:
        description: "Also run the real-compositor lane on an available self-hosted arrayscope-gpu runner"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen
  PYQTGRAPH_QT_LIB: PySide6
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff + dead code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.15.22
      - run: ruff check --output-format github .
      - run: ruff format --check .
      - run: python tools/dead_code.py

  python-compat:
    name: Python compatibility ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install locked compatibility environment
        run: uv sync --frozen --no-default-groups --extra dev --extra wgpu --python ${{ matrix.python-version }}
      - name: Run Python compatibility tests
        run: |
          uv run --no-sync python tools/ci_report.py pytest \
            --name "Python ${{ matrix.python-version }} compatibility" \
            --output tests/artifacts/ci/compatibility --timeout 600 -- -q \
            tests/core tests/operations \
            tests/kernel/test_process_backend.py tests/kernel/test_shm_slots.py \
            tests/app/test_architecture_guards.py \
            tests/app/test_operation_benchmarks.py tests/app/test_public_api.py
      - name: Summarize tests
        if: always()
        run: python tools/ci_report.py summarize tests/artifacts/ci --title "Python ${{ matrix.python-version }} compatibility" --artifact compatibility-${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.python-version }}
          path: tests/artifacts/ci/
          if-no-files-found: warn

  # No cold-cache duplicate GUI sweep: a smoke is explicitly labelled as such.
  # A full map is seeded only by workflow_dispatch, which replaces coverage.
  # Valid maps are saved on test failures as well as successes, including their
  # red/skip ledgers and attribution metadata. CI disables implicit selection;
  # the cached path deliberately opts in with --testmon --rerun-reds.
  affected-gui-tests:
    name: ${{ inputs.seed_gui_map && 'Seed complete GUI selection map' || 'GUI fast signal (cached selection or smoke)' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.seed_gui_map && 40 || 15 }}
    env:
      ARRAYSCOPE_STRICT_UI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Restore a fully seeded GUI map
        uses: actions/cache/restore@v4
        with:
          path: |
            .testmondata*
            .ci-gui-map.json
          key: gui-map-v2-py312-strict-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            gui-map-v2-py312-strict-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install locked environment
        run: uv sync --frozen --no-default-groups --extra dev --extra wgpu --python 3.12
      - name: Run GUI fast signal or explicit map seed
        run: |
          scope=smoke
          mkdir -p tests/artifacts/ci
          if [ "${{ inputs.seed_gui_map }}" = "true" ]; then
            scope=seed
          elif [ -f .ci-gui-map.json ]; then
            # A broad change belongs to the exhaustive owner, not a second
            # full GUI run. The recorded cost is a lower bound, not a deadline.
            if uv run --no-sync python tools/test_selection.py impact --json > tests/artifacts/ci/selection-impact.json; then
              scope=$(python - <<'PY'
          import json
          from pathlib import Path
          impact = json.loads(Path("tests/artifacts/ci/selection-impact.json").read_text())
          gui = ("tests/display/", "tests/window/", "tests/ui/", "tests/app/")
          unknown = [path for path in impact["unmapped_test_files"] if path.startswith(gui)]
          affected = [name for name in impact["affected_tests"] if name.startswith(gui)]
          print("affected" if not unknown and len(affected) <= 200 and impact["affected_seconds"] <= 120 else "smoke")
          PY
              )
            fi
          fi
          echo "GUI fast-signal scope: $scope (coverage owns exhaustive correctness)"
          if [ "$scope" = seed ]; then
            uv run --no-sync python tools/ci_report.py pytest \
              --name "Complete strict GUI map seed" \
              --output tests/artifacts/ci/gui --timeout 1800 -- -q \
              --testmon-noselect tests/display tests/window tests/ui tests/app
          elif [ "$scope" = affected ]; then
            uv run --no-sync python tools/ci_report.py pytest \
              --name "Affected strict GUI tests" --allow-empty \
              --output tests/artifacts/ci/gui --timeout 600 -- -q \
              --testmon --rerun-reds tests/display tests/window tests/ui tests/app
          else
            uv run --no-sync python tools/ci_report.py pytest \
              --name "Strict GUI smoke (cold map or broad impact)" \
              --output tests/artifacts/ci/gui --timeout 180 -- -q \
              --testmon-noselect tests/ui/test_launcher_window.py \
              tests/ui/test_command_palette.py tests/app/test_open_flow.py
          fi
      - name: Check whether the complete map can be saved
        id: map
        if: always()
        env:
          SEED_REQUESTED: ${{ inputs.seed_gui_map && '1' || '0' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path("tests/artifacts/ci/gui/status.json")
          if report.is_file():
              status = json.loads(report.read_text())
              completed = status["exit_code"] in (0, 1) and not status["timed_out"]
              stamp = Path(".ci-gui-map.json")
              if completed and status["junit_present"] and os.environ["SEED_REQUESTED"] == "1":
                  stamp.write_text(json.dumps({"scope": ["tests/display", "tests/window", "tests/ui", "tests/app"], "environment": "offscreen+strict-ui", "complete": True}) + "\n")
              if completed and stamp.is_file():
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write("save=true\n")
          PY
      - name: Save GUI map even when tests fail
        if: always() && steps.map.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .testmondata*
            .ci-gui-map.json
          key: gui-map-v2-py312-strict-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
      - name: Summarize tests
        if: always()
        run: python tools/ci_report.py summarize tests/artifacts/ci --title "GUI fast signal / explicit seed" --artifact gui-test-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-test-report
          path: tests/artifacts/ci/
          if-no-files-found: warn

  coverage:
    name: Exhaustive strict coverage Python 3.12
    if: ${{ !inputs.seed_gui_map }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      ARRAYSCOPE_STRICT_UI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install locked maintained development environment
        run: uv sync --frozen --python 3.12
      - name: Run exhaustive suite with strict UI and coverage
        # CI turns selection off. Keep GPU correctness assertions enabled:
        # hosted software adapters are useful correctness smoke, not hardware
        # timing/presentation acceptance. Do not weaken assertions for a green.
        run: |
          uv run --no-sync python tools/ci_report.py pytest \
            --name "Exhaustive strict suite with coverage" \
            --output tests/artifacts/ci/coverage --timeout 1800 -- tests/ -q \
            --cov=arrayscope --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Summarize tests
        if: always()
        run: python tools/ci_report.py summarize tests/artifacts/ci --title "Exhaustive strict coverage" --artifact exhaustive-coverage-report
      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-coverage-report
          include-hidden-files: true
          path: |
            tests/artifacts/
            coverage.xml
            .coverage*
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          flags: full-suite
          name: linux-py312-strict-full-suite
          fail_ci_if_error: true

  build-package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --no-default-groups --extra dev --python 3.12
      - run: uv run --no-sync python -m build
      - run: uv run --no-sync python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  platform-validation:
    name: Platform validation (${{ matrix.os }})
    needs: build-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - name: Install locked test dependencies without the project
        run: uv sync --frozen --no-default-groups --extra dev --extra wgpu --no-install-project --python 3.12
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install wheel and verify its import outside the checkout
        run: |
          uv pip install --python .venv --no-deps dist/*.whl
          interpreter=$(uv run --no-sync python -c 'import sys; print(sys.executable)')
          cd "$RUNNER_TEMP"
          "$interpreter" - <<'PY'
          from importlib.metadata import metadata, version
          import arrayscope
          assert metadata("ArrayScope")["Name"] == "ArrayScope"
          assert arrayscope.__version__ == version("ArrayScope")
          print("Wheel import:", arrayscope.__file__, arrayscope.__version__)
          PY
          "$interpreter" -m arrayscope --help
      - name: Run screenshot smoke tests
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python tools/ci_report.py pytest \
            --name "Native platform screenshot smoke" \
            --output tests/artifacts/ci/screenshots --timeout 180 -- \
            tests/ui/test_qt_smoke_artifacts.py -q -n 0
      - name: Run PyQtGraph benchmark smoke
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python tools/ci_report.py run \
            --name "PyQtGraph platform benchmark smoke" \
            --output tests/artifacts/ci/benchmark --timeout 180 -- \
            python -m arrayscope.display.rendering_benchmarks --runs 1 \
            --jsonl tests/artifacts/rendering-benchmark-pyqtgraph-${{ matrix.os }}.jsonl
      - name: Run platform display/window tests
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python tools/ci_report.py pytest \
            --name "Platform display/window correctness" \
            --output tests/artifacts/ci/platform --timeout 600 -- -q \
            tests/display tests/window tests/app/test_public_api.py -n 0
      - name: Summarize platform tests
        if: always()
        run: python tools/ci_report.py summarize tests/artifacts/ci --title "Platform validation (${{ matrix.os }})" --artifact platform-artifacts-${{ matrix.os }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-artifacts-${{ matrix.os }}
          path: tests/artifacts/
          if-no-files-found: warn

  rc-artifacts:
    name: Hosted software-rendering diagnostics (not hardware acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
      - run: uv sync --frozen --no-default-groups --extra dev --extra wgpu --python 3.12
      - name: Generate PyQtGraph diagnostics
        run: |
          uv run --no-sync python tools/ci_report.py run \
            --name "PyQtGraph diagnostics" --output tests/artifacts/ci/diagnostics-pyqtgraph --timeout 120 -- \
            python -m arrayscope.tools.release_diagnostics --backend pyqtgraph \
            --jsonl tests/artifacts/diagnostics-pyqtgraph.jsonl
      - name: Generate WGPU software-adapter diagnostics
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python tools/ci_report.py run \
            --name "WGPU software-adapter diagnostics" --output tests/artifacts/ci/diagnostics-wgpu --timeout 120 -- \
            python -m arrayscope.tools.release_diagnostics --backend wgpu \
            --jsonl tests/artifacts/diagnostics-wgpu.jsonl
      - name: Generate PyQtGraph benchmark artifact
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python tools/ci_report.py run \
            --name "PyQtGraph benchmark" --output tests/artifacts/ci/benchmark-pyqtgraph --timeout 120 -- \
            python -m arrayscope.display.rendering_benchmarks --runs 1 \
            --jsonl tests/artifacts/rendering-benchmark-pyqtgraph-linux.jsonl
      - name: Generate WGPU software-adapter benchmark artifact
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python tools/ci_report.py run \
            --name "WGPU software-adapter benchmark" --output tests/artifacts/ci/benchmark-wgpu --timeout 120 -- \
            python -m arrayscope.display.rendering_benchmarks --tile-counts 1,16,64 \
            --pan-steps 8 --pan-tile-edge 64 --pan-present-method bitmap \
            --jsonl tests/artifacts/rendering-benchmark-wgpu-linux.jsonl
      - name: Summarize diagnostics
        if: always()
        run: python tools/ci_report.py summarize tests/artifacts/ci --title "Hosted diagnostics; hardware acceptance not established" --artifact rc-artifacts-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-artifacts-linux
          path: tests/artifacts/
          if-no-files-found: warn

  # Requires an explicitly provisioned runner with real GPU access and Weston.
  # This is opt-in, never satisfied by a green hosted software-rendering smoke.
  hardware-gpu:
    name: Real GPU / compositor interaction (explicit opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.hardware_gpu }}
    runs-on: [self-hosted, linux, x64, arrayscope-gpu]
    timeout-minutes: 25
    env:
      ARRAYSCOPE_GPU_TESTS: "1"
      ARRAYSCOPE_STRICT_UI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --python 3.12
      - name: Verify a hardware adapter is available
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          import wgpu
          adapter = wgpu.gpu.request_adapter_sync(power_preference="low-power")
          info = dict(adapter.info)
          Path("tests/artifacts").mkdir(parents=True, exist_ok=True)
          Path("tests/artifacts/hardware-adapter.json").write_text(json.dumps(info, indent=2))
          assert str(info.get("adapter_type", "")).lower() in {"integratedgpu", "discretegpu"}, info
          print(json.dumps(info))
          PY
      - name: Run real-compositor interactions
        run: |
          uv run --no-sync python tools/ci_report.py run \
            --name "Real GPU compositor interactions" \
            --output tests/artifacts/ci/hardware --timeout 900 -- \
            python -m arrayscope.tools.headless_display --log-dir tests/artifacts/compositor -- \
            python tools/ci_report.py pytest \
              --name "Real GPU interaction assertions" \
              --output tests/artifacts/ci/gpu-interaction --timeout 840 -- \
              tests/gpu_interaction -q -n 0
      - name: Summarize hardware lane
        if: always()
        run: python tools/ci_report.py summarize tests/artifacts/ci --title "Explicit real-GPU/compositor lane" --artifact hardware-gpu-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-gpu-report
          path: tests/artifacts/
          if-no-files-found: warn
